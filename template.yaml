AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless Event-Driven Cloud Processing Pipeline (SAM Template)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        DYNAMODB_TABLE: !Ref EventsTable
        S3_DATA_LAKE: !Ref DataLakeBucket

Resources:
  # Ingestion Function
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: handlers.ingest_handler.lambda_handler
      Environment:
        Variables:
          PROCESSING_QUEUE_URL: !Ref ProcessingQueue
      Events:
        ApiIngest:
          Type: Api
          Properties:
            Path: /events
            Method: post

  # Processing Worker Function
  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ./
      Handler: handlers.process_handler.lambda_handler
      Events:
        QueueBatchEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt ProcessingQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # Primary Processing SQS Queue with DLQ
  ProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 3

  # Dead Letter Queue
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  # DynamoDB Event Store
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # S3 Data Lake Bucket
  DataLakeBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled

Outputs:
  IngestApiUrl:
    Description: API Gateway endpoint URL for event ingestion
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/events"
  ProcessingQueueUrl:
    Description: SQS Processing Queue URL
    Value: !Ref ProcessingQueue
  EventsTableName:
    Description: DynamoDB Table Name
    Value: !Ref EventsTable
